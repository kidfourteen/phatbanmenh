    function calculateDestiny(yearInput, buddhasMap) {
      const year = parseInt(yearInput, 10);
      if (isNaN(year) || year < 1920 || year > 2040) return null;

      const stem = STEMS[year % 10];
      const branch = BRANCHES[year % 12];
      const canChi = `${stem} ${branch}`;
      const napAm = NAP_AM_MAP[canChi] || { element: 'Kim', detail: 'Bản mệnh Cát Tường' };
      const zodiacInfo = ZODIAC_DATA_2027.find(z => z.branch === branch);
      const buddha = (buddhasMap || INITIAL_BUDDHAS)[zodiacInfo.buddhaId];

      return {
        year,
        stem,
        branch,
        canChi,
        napAm,
        zodiacInfo,
        buddha
      };
    }

            bankName: 'TECHCOMBANK', accountNo: '2009222222', accountName: 'HOANG THI HANH'
          };
        } catch (e) {
          return { bankName: 'TECHCOMBANK', accountNo: '2009222222', accountName: 'HOANG THI HANH' };
        }
      });

      const [tgCfg, setTgCfg] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.TG_CFG) || 'null') || { token: '', chatId: '', enabled: false };
        } catch (e) {
          return { token: '', chatId: '', enabled: false };
        }
      });

      const [sheetCfg, setSheetCfg] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.SHEET_CFG) || 'null');
          if (saved && saved.webhookUrl) return saved;
        } catch (e) {}
        return { webhookUrl: HARDCODED_GOOGLE_SHEET_URL, enabled: true };
      });

      const [birthYear, setBirthYear] = useState('1996');
      const [filter2027, setFilter2027] = useState('ALL');
      const [expandedZodiacBranch, setExpandedZodiacBranch] = useState('Tý');

      const [modalOpen, setModalOpen] = useState(false);
      const [selectedBuddha, setSelectedBuddha] = useState(null);
      const [orderForm, setOrderForm] = useState({
        name: '', phone: '', address: '', birthYear: '1996', qty: 1, payMethod: 'bank', note: ''
      });
      const [orderStep, setOrderStep] = useState('form');
      const [createdOrder, setCreatedOrder] = useState(null);

      // Admin state (Chỉ mở khi bấm 5 lần vào Logo)
      const [logoClicks, setLogoClicks] = useState(0);
      const [loginModalOpen, setLoginModalOpen] = useState(false);
      const [loginForm, setLoginForm] = useState({ user: '', pass: '', error: '' });
      const [isAdminView, setIsAdminView] = useState(false);
      const [adminTab, setAdminTab] = useState('products');
      const [editingBuddha, setEditingBuddha] = useState(null);
      const [uploadingSlot, setUploadingSlot] = useState(null);
      const [syncingGithub, setSyncingGithub] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3200);
      };

      // Tự động tải products.json & settings.json từ GitHub khi khách vào trang
      useEffect(() => {
        if (!ghCfg.owner || !ghCfg.repo) return;
        const baseRaw = `https://raw.githubusercontent.com/${ghCfg.owner}/${ghCfg.repo}/${ghCfg.branch || 'main'}`;

        fetch(`${baseRaw}/${ghCfg.path || 'products.json'}?t=${Date.now()}`, { cache: 'no-store' })
          .then(r => (r.ok ? r.json() : null))
          .then(data => {
            if (data && typeof data === 'object') {
              setBuddhas(prev => {
                const next = { ...prev };
                Object.keys(next).forEach(k => {
                  if (data[k]) {
                    next[k] = {
                      ...next[k], ...data[k],
                      price: Number(data[k].price) || DEFAULT_PRICE,
                      oldPrice: Number(data[k].oldPrice) || DEFAULT_OLD_PRICE,
                      material: data[k].material || DEFAULT_MATERIAL
                    };
                  }
                });
                try { localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(next)); } catch (e) {}
                return next;
              });
            }
          })
          .catch(() => {});

        fetch(`${baseRaw}/settings.json?t=${Date.now()}`, { cache: 'no-store' })
          .then(r => (r.ok ? r.json() : null))
          .then(s => {
            if (s && typeof s === 'object') {
              if (s.bankCfg) {
                setBankCfg(s.bankCfg);
                try { localStorage.setItem(STORAGE_KEYS.BANK_CFG, JSON.stringify(s.bankCfg)); } catch (e) {}
              }
              if (s.tgCfg) {
                setTgCfg(s.tgCfg);
                try { localStorage.setItem(STORAGE_KEYS.TG_CFG, JSON.stringify(s.tgCfg)); } catch (e) {}
              }
              if (s.sheetCfg && s.sheetCfg.webhookUrl) {
                setSheetCfg(s.sheetCfg);
                try { localStorage.setItem(STORAGE_KEYS.SHEET_CFG, JSON.stringify(s.sheetCfg)); } catch (e) {}
              }
            }
          })
          .catch(() => {});
      }, []);

      const destinyResult = useMemo(() => calculateDestiny(birthYear, buddhas), [birthYear, buddhas]);

      useEffect(() => {
        if (destinyResult?.branch) {
          setExpandedZodiacBranch(destinyResult.branch);
        }
      }, [destinyResult?.branch]);

      const filtered2027List = useMemo(() => {
        if (filter2027 === 'HAN_2027') return ZODIAC_DATA_2027.filter(z => z.statusType === 'danger' || z.statusType === 'warning');
        if (filter2027 === 'CAT_2027') return ZODIAC_DATA_2027.filter(z => z.statusType === 'excellent' || z.statusType === 'good');
        return ZODIAC_DATA_2027;
      }, [filter2027]);

      const orderPricing = useMemo(() => {
        const unitPrice = Number(selectedBuddha?.price) || DEFAULT_PRICE;
        const qty = Math.max(1, Number(orderForm.qty) || 1);
        const subtotal = unitPrice * qty;
        const isBankQR = orderForm.payMethod === 'bank';
        const shipFee = isBankQR ? 0 : DEFAULT_SHIP_FEE;
        const total = subtotal + shipFee;
        return { unitPrice, qty, subtotal, isBankQR, shipFee, total };
      }, [selectedBuddha, orderForm.qty, orderForm.payMethod]);

      const handleLogoClick = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setLogoClicks(prev => {
          const next = prev + 1;
          if (next >= 5) {
            setLoginModalOpen(true);
            return 0;
          }
          setTimeout(() => setLogoClicks(0), 1500);
          return next;
        });
      };

      const handleSelectZodiacCard = (z) => {
        const currentCalc = calculateDestiny(birthYear, buddhas);
        if (!currentCalc || currentCalc.branch !== z.branch) {
          setBirthYear(z.sampleYear);
        }
        setExpandedZodiacBranch(prev => (prev === z.branch ? null : z.branch));
      };

      const openModal = (buddha, yearPrefill) => {
        const latestBuddha = buddhas[buddha.id] || buddha;
        setSelectedBuddha(latestBuddha);
        setOrderForm(prev => ({
          ...prev,
          birthYear: yearPrefill ? String(yearPrefill) : String(birthYear || prev.birthYear),
          qty: 1,
          payMethod: 'bank'
        }));
        setOrderStep('form');
        setModalOpen(true);
      };

      // =========================================================
      // HÀM ĐỔ ĐƠN TRỰC TIẾP VỀ GOOGLE SHEET ĐÃ FIX CỨNG (ĐA LUỒNG)
      // =========================================================
      const notifyExternalServices = (newOrder) => {
        const activeWebhookUrl = (sheetCfg.webhookUrl || HARDCODED_GOOGLE_SHEET_URL || '').trim();
        if (activeWebhookUrl) {
          const payMethodLabel = newOrder.payMethod === 'bank' ? 'Chuyển khoản QR (Freeship + Quà)' : 'COD Nhận hàng thanh toán';
          const simpleParams = {
            id: String(newOrder.id || ''),
            time: String(newOrder.time || ''),
            name: String(newOrder.name || ''),
            phone: String(newOrder.phone || ''),
            address: String(newOrder.address || ''),
            birthYear: String(newOrder.birthYear || ''),
            buddhaName: String(newOrder.buddhaName || ''),
            qty: String(newOrder.qty || 1),
            shipFee: String(newOrder.shipFee || 0),
            freeGift: String(newOrder.freeGift || ''),
            total: String(newOrder.total || 0),
            payMethod: payMethodLabel,
            note: String(newOrder.note || ''),
            payStatus: String(newOrder.payStatus || 'Mới')
          };

          const qs = new URLSearchParams();
          Object.keys(simpleParams).forEach(k => qs.append(k, simpleParams[k]));

          // Luồng 1: POST URLSearchParams chuẩn (như mumbigsize.com)
          fetch(activeWebhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: qs
          }).catch(() => {
            // Luồng 2 dự phòng cho Safari iOS / Zalo Webview: GET qua Image Beacon
            try {
              const sep = activeWebhookUrl.includes('?') ? '&' : '?';
              const img = new Image();
              img.src = `${activeWebhookUrl}${sep}${qs.toString()}&_t=${Date.now()}`;
            } catch (e) {}
          });
        }

        // Bắn thông báo về Telegram nếu bật
        if (tgCfg.token && tgCfg.chatId) {
          const msg = [
            `🪷 *ĐƠN THỈNH PHẬT BẢN MỆNH (${newOrder.id})*`,
            `👤 Khách: *${newOrder.name}*`,
            `📞 SĐT: \`${newOrder.phone}\``,
            `📍 Đ/c: ${newOrder.address}`,
            `🎂 Năm sinh: ${newOrder.birthYear}`,
            `📿 Vật phẩm: *${newOrder.buddhaName}* (SL: ${newOrder.qty})`,
            `💳 Thanh toán: ${newOrder.payMethod === 'bank' ? 'Chuyển khoản QR (Freeship + Quà)' : 'COD (Ship 19k)'}`,
            `💰 Tổng thu: *${formatVND(newOrder.total)}*`,
            `📌 Trạng thái: ${newOrder.payStatus}`
          ].join('\n');
          fetch(`https://api.telegram.org/bot${tgCfg.token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: tgCfg.chatId, text: msg, parse_mode: 'Markdown' })
          }).catch(() => {});
        }
      };

      const handleOrderSubmit = (e) => {
        e.preventDefault();
        if (!orderForm.phone.trim() || !orderForm.name.trim() || !orderForm.address.trim()) {
          showToast('Vui lòng điền Họ tên, Số điện thoại và Địa chỉ nhận hàng!');
          return;
        }
        const newOrder = {
          id: '#PBM' + Date.now().toString().slice(-4),
          time: new Date().toLocaleString('vi-VN'),
          name: orderForm.name.trim(),
          phone: orderForm.phone.trim(),
          address: orderForm.address.trim(),
          birthYear: orderForm.birthYear,
          note: orderForm.note.trim(),
          buddhaId: selectedBuddha.id,
          buddhaName: selectedBuddha.fullName,
          qty: orderPricing.qty,
          unitPrice: orderPricing.unitPrice,
          subtotal: orderPricing.subtotal,
          shipFee: orderPricing.shipFee,
          total: orderPricing.total,
          payMethod: orderForm.payMethod,
          freeGift: orderPricing.isBankQR ? 'Tặng 01 món quà phong thuỷ ngẫu nhiên + Freeship' : 'Không',
          payStatus: orderForm.payMethod === 'bank' ? 'Chờ quét QR' : 'COD - Chờ giao'
        };

        const updated = [newOrder, ...orders];
        setOrders(updated);
        try { localStorage.setItem(STORAGE_KEYS.ORDERS, JSON.stringify(updated)); } catch (err) {}

        // Đổ đơn ngay lập tức về Google Sheet đã gắn cứng
        notifyExternalServices(newOrder);

        setCreatedOrder(newOrder);
        if (orderForm.payMethod === 'bank') {
          setOrderStep('qr');
          showToast('📿 Đã ghi nhận đơn thỉnh! Vui lòng quét mã QR bên dưới.');
        } else {
          setOrderStep('success');
          showToast('🎉 Đặt thỉnh thành công!');
        }
      };

      const finalizeOrder = (orderObj) => {
        const confirmedOrder = { ...orderObj, payStatus: 'Đã xác nhận chuyển khoản QR' };
        const updated = orders.map(o => (o.id === orderObj.id ? confirmedOrder : o));
        setOrders(updated);
        try { localStorage.setItem(STORAGE_KEYS.ORDERS, JSON.stringify(updated)); } catch (e) {}
        notifyExternalServices(confirmedOrder);
        setCreatedOrder(confirmedOrder);
        setOrderStep('success');
        showToast('✅ Đã xác nhận chuyển khoản thành công!');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        const ok = ADMIN_ACCOUNTS.some(acc => acc.user === loginForm.user.trim() && acc.pass === loginForm.pass);
        if (ok) {
          setLoginModalOpen(false);
          setIsAdminView(true);
          setLoginForm({ user: '', pass: '', error: '' });
          showToast('✅ Đăng nhập Quản trị phatbanmenh thành công!');
        } else {
          setLoginForm(prev => ({ ...prev, error: 'Sai tài khoản hoặc mật khẩu (phatbanmenh / 123123123)' }));
        }
      };

      // Upload ảnh lên Cloudinary
      const handleCloudinaryUpload = async (file, buddhaId, slotIdx) => {
        if (!file) return;
        if (!cldCfg.cloud || !cldCfg.preset) {
          showToast('⚠️ Vui lòng nhập Cloudinary Cloud Name & Preset trong tab Cài Đặt!');
          return;
        }
        setUploadingSlot(`${buddhaId}_${slotIdx}`);
        try {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('upload_preset', cldCfg.preset.trim());
          const res = await fetch(`https://api.cloudinary.com/v1_1/${cldCfg.cloud.trim()}/image/upload`, {
            method: 'POST',
            body: fd
          });
          const data = await res.json();
          if (data.secure_url) {
            const optimizedUrl = data.secure_url.replace('/upload/', '/upload/f_auto,q_auto,w_900/');
            setBuddhas(prev => {
              const target = { ...(prev[buddhaId] || INITIAL_BUDDHAS[buddhaId]) };
              const imgs = Array.isArray(target.images) ? [...target.images] : [];
              imgs[slotIdx] = optimizedUrl;
              target.images = imgs.filter(Boolean);
              const next = { ...prev, [buddhaId]: target };
              localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(next));
              return next;
            });
            showToast('✅ Đã tải ảnh lên Cloudinary thành công!');
          } else {
            showToast('❌ Lỗi Cloudinary: ' + (data.error?.message || 'Kiểm tra lại Preset Unsigned'));
          }
        } catch (err) {
          showToast('❌ Không thể kết nối Cloudinary!');
        }
        setUploadingSlot(null);
      };

      // Đồng bộ file JSON lên GitHub
      const pushFileToGitHub = async (filePath, contentObj, commitMessage) => {
        if (!ghCfg.token || !ghCfg.owner || !ghCfg.repo) {
          showToast('⚠️ Hãy nhập GitHub Personal Access Token (PAT) ở tab Cài Đặt!');
          return false;
        }
        const apiUrl = `https://api.github.com/repos/${ghCfg.owner.trim()}/${ghCfg.repo.trim()}/contents/${filePath}`;
        const headers = {
          Authorization: `token ${ghCfg.token.trim()}`,
          Accept: 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        };
        let sha = null;
        try {
          const getRes = await fetch(`${apiUrl}?ref=${ghCfg.branch || 'main'}`, { headers });
          if (getRes.ok) {
            const getJson = await getRes.json();
            sha = getJson.sha;
          }
        } catch (e) {}

        const jsonStr = JSON.stringify(contentObj, null, 2);
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        const putBody = {
          message: commitMessage || `Update ${filePath}`,
          content: encoded,
          branch: ghCfg.branch || 'main'
        };
        if (sha) putBody.sha = sha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers,
          body: JSON.stringify(putBody)
        });
        return putRes.ok;
      };

      const handleSyncAllToGitHub = async () => {
        setSyncingGithub(true);
        try {
          localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(buddhas));
          localStorage.setItem(STORAGE_KEYS.GH_CFG, JSON.stringify(ghCfg));
          localStorage.setItem(STORAGE_KEYS.CLD_CFG, JSON.stringify(cldCfg));
          localStorage.setItem(STORAGE_KEYS.BANK_CFG, JSON.stringify(bankCfg));
          localStorage.setItem(STORAGE_KEYS.TG_CFG, JSON.stringify(tgCfg));
          localStorage.setItem(STORAGE_KEYS.SHEET_CFG, JSON.stringify(sheetCfg));

          const ok1 = await pushFileToGitHub(ghCfg.path || 'products.json', buddhas, 'Sync 8 Phat Ban Menh products');
          const ok2 = await pushFileToGitHub('settings.json', { bankCfg, tgCfg, sheetCfg }, 'Sync payment & webhook settings');
          if (ok1 && ok2) {
            showToast('🚀 Đã đồng bộ ảnh 8 Mặt Phật & Cài đặt lên GitHub thành công!');
          } else {
            showToast('⚠️ Đã lưu trên máy. Kiểm tra lại GitHub Token nếu muốn đẩy lên Server.');
          }
        } catch (e) {
          showToast('❌ Lỗi đồng bộ GitHub!');
        }
        setSyncingGithub(false);
      };

      const scrollTo = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      // =========================================================
      // GIAO DIỆN QUẢN TRỊ ADMIN (ẨN - BẤM 5 LẦN VÀO LOGO MỚI HIỆN)
      // =========================================================
      if (isAdminView) {
        return (
          <div className="min-h-screen bg-[#0A0908] text-stone-100 p-4 sm:p-6">
            {toastMsg && (
              <div className="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl bg-amber-400 text-stone-950 font-bold text-xs shadow-2xl">
                {toastMsg}
              </div>
            )}

            <div className="max-w-6xl mx-auto space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-3 bg-[#14110F] p-4 rounded-2xl border border-stone-800">
                <div>
                  <h1 className="text-lg font-bold text-amber-300">QUẢN TRỊ PHẬT BẢN MỆNH (phatbanmenh.store)</h1>
                  <p className="text-xs text-stone-400">Đã gắn cứng Google Sheet Apps Script • Tự động nhận đơn từ mọi điện thoại</p>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={() => setAdminTab('products')}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold ${adminTab === 'products' ? 'bg-amber-400 text-stone-950' : 'bg-stone-900 text-stone-300'}`}
                  >
                    📿 8 Mặt Phật & Up Ảnh
                  </button>
                  <button
                    onClick={() => setAdminTab('orders')}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold ${adminTab === 'orders' ? 'bg-amber-400 text-stone-950' : 'bg-stone-900 text-stone-300'}`}
                  >
                    📦 Đơn Hàng ({orders.length})
                  </button>
                  <button
                    onClick={() => setAdminTab('settings')}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold ${adminTab === 'settings' ? 'bg-amber-400 text-stone-950' : 'bg-stone-900 text-stone-300'}`}
                  >
                    ⚙️ Server GitHub & Cài Đặt
                  </button>
                  <button
                    onClick={() => setIsAdminView(false)}
                    className="px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-800 text-amber-200 hover:bg-stone-700"
                  >
                    ← Về Trang Khách Hàng
                  </button>
                </div>
              </div>

              {adminTab === 'products' && (
                <div className="space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3 bg-[#12100E] p-4 rounded-2xl border border-stone-800">
                    <div className="text-xs text-stone-300">
                      Tải ảnh thật cho từng vị Phật (lưu trên Cloudinary <strong className="text-amber-300">{cldCfg.cloud}</strong>) rồi bấm nút bên phải để cập nhật lên GitHub cho toàn bộ khách hàng xem.
                    </div>
                    <button
                      onClick={handleSyncAllToGitHub}
                      disabled={syncingGithub}
                      className="px-5 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-stone-950 font-bold text-xs"
                    >
                      {syncingGithub ? '⏳ Đang đẩy lên GitHub...' : '☁️ Lưu & Đồng Bộ Lên GitHub'}
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    {Object.values(buddhas).map(b => (
                      <div key={b.id} className="p-4 rounded-2xl bg-[#14110F] border border-stone-800 space-y-3 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-center text-xs mb-2">
                            <span className="px-2 py-0.5 rounded bg-stone-900 text-amber-200 font-semibold">{b.zodiacBadge}</span>
                            <span className="font-bold text-amber-300">{formatVND(b.price)}</span>
                          </div>
                          <ProductVisual buddha={b} size="sm" />
                          <h3 className="font-bold text-sm text-amber-200 text-center mt-2">{b.fullName}</h3>

                          {/* 4 Ô Upload ảnh thật */}
                          <div className="grid grid-cols-4 gap-1.5 mt-3">
                            {[0, 1, 2, 3].map(slot => {
                              const currentImg = b.images?.[slot];
                              const isUploading = uploadingSlot === `${b.id}_${slot}`;
                              return (
                                <label
                                  key={slot}
                                  className="relative aspect-square rounded-lg border border-dashed border-stone-700 bg-[#0A0908] flex items-center justify-center cursor-pointer overflow-hidden hover:border-amber-400"
                                >
                                  {currentImg ? (
                                    <img src={currentImg} alt="" className="w-full h-full object-cover" />
                                  ) : (
                                    <span className="text-[10px] text-stone-500">{isUploading ? '...' : `+Ảnh ${slot + 1}`}</span>
                                  )}
                                  <input
                                    type="file"
                                    accept="image/*"
                                    className="hidden"
                                    onChange={(e) => handleCloudinaryUpload(e.target.files?.[0], b.id, slot)}
                                  />
                                </label>
                              );
                            })}
                          </div>
                        </div>

                        {b.images?.length > 0 && (
                          <button
                            type="button"
                            onClick={() => {
                              setBuddhas(prev => {
                                const next = { ...prev, [b.id]: { ...prev[b.id], images: [] } };
                                localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(next));
                                return next;
                              });
                            }}
                            className="w-full py-1.5 rounded-lg bg-stone-900 text-stone-400 hover:text-white text-[11px]"
                          >
                            Xoá ảnh (Dùng 3D mặc định)
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {adminTab === 'orders' && (
                <div className="bg-[#14110F] p-4 sm:p-6 rounded-2xl border border-stone-800 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <h2 className="font-bold text-base text-amber-200">Danh Sách Đơn Hàng Trên Trình Duyệt Này ({orders.length})</h2>
                    <button
                      onClick={() => {
                        const testOrder = {
                          id: '#TEST' + Date.now().toString().slice(-3),
                          time: new Date().toLocaleString('vi-VN'),
                          name: 'Khách Test Điện Thoại',
                          phone: '0988888888',
                          address: 'Hà Nội',
                          birthYear: '1996',
                          buddhaName: 'Thiên Thủ Thiên Nhãn Bồ Tát',
                          qty: 1,
                          shipFee: 0,
                          freeGift: 'Freeship + Tặng 01 quà phong thuỷ',
                          total: 349,
                          payMethod: 'bank',
                          note: 'Test bắn đơn thẳng vào Google Sheet cứng',

                          </span>
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();
                              setBirthYear(z.sampleYear);
                              openModal(buddha, z.sampleYear);
                            }}
                            className="text-xs font-bold text-amber-300 hover:text-amber-200 underline"
                          >
                            Thỉnh giải hạn →
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

            </div>
          </section>

          {/* ========================================================= */}
          {/* 3. BỘ SƯU TẬP 8 VỊ PHẬT BẢN MỆNH (TỐI GIẢN MÀU SẮC)        */}
          {/* ========================================================= */}
          <section id="bo-suu-tap" className="relative z-10 py-8 sm:py-14 border-b border-stone-900">
            <div className="max-w-6xl mx-auto px-3 sm:px-4">
              
              <div className="text-center sm:text-left mb-5 sm:mb-8">
                <span className="text-[11px] font-semibold uppercase tracking-widest text-amber-300/90">
                  🪷 PHÁP KHÍ HỘ MỆNH ĐỒNG THAU NGUYÊN KHỐI
                </span>
                <h2 className="text-xl sm:text-3xl font-bold text-stone-100 mt-0.5 font-serif-title">
                  8 Mặt Dây Chuyền <span className="text-amber-300">Phật Bản Mệnh</span>
                </h2>
              </div>

              <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-5">
                {Object.values(buddhas).map((buddha) => {
                  const isCurrentBuddha = destinyResult?.buddha?.id === buddha.id;
                  return (
                    <div
                      key={buddha.id}
                      onClick={() => openModal(buddha, birthYear)}
                      className={`cursor-pointer rounded-2xl bg-[#12100E] border transition-all p-2.5 sm:p-4 flex flex-col justify-between group ${
                        isCurrentBuddha
                          ? 'border-amber-400/80 shadow-[0_0_25px_rgba(212,175,55,0.12)]'
                          : 'border-stone-800/90 hover:border-amber-500/40'
                      }`}
                    >
                      <div>
                        <div className="flex items-center justify-between gap-1 mb-1.5">
                          <span className="px-2 py-0.5 rounded-md bg-[#181512] border border-stone-800 text-stone-300 text-[10px] sm:text-xs font-medium truncate">
                            {buddha.zodiacBadge}
                          </span>
                          <span className="text-xs sm:text-sm font-bold text-amber-300 shrink-0">{formatVND(buddha.price)}</span>
                        </div>

                        <div className="py-1 scale-90 sm:scale-100 origin-center">
                          <ProductVisual buddha={buddha} size="md" />
                        </div>

                        <div className="text-center mt-1 space-y-1">
                          <h3 className="text-xs sm:text-base font-bold text-stone-100 group-hover:text-amber-200 transition-colors line-clamp-1">
                            {buddha.name}
                          </h3>
                          <p className="text-[9px] sm:text-[10px] text-stone-400 font-medium line-clamp-1">
                            Đồng Thau • Đá Lục Bảo
                          </p>
                          <div className="hidden sm:flex flex-wrap justify-center gap-1.5 pt-1">
                            {buddha.tags.slice(0, 2).map((t, idx) => (
                              <span key={idx} className="text-[11px] px-2 py-0.5 rounded bg-[#0C0A09] text-stone-400 border border-stone-800/80">
                                {t}
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>

                      <button
                        type="button"
                        className="mt-2.5 sm:mt-4 w-full py-2 sm:py-2.5 rounded-xl bg-[#1A1612] group-hover:bg-amber-400 text-amber-200 group-hover:text-stone-950 font-bold text-[11px] sm:text-xs border border-amber-500/25 transition-all"
                      >
                        Thỉnh • {formatVND(buddha.price)}
                      </button>
                    </div>
                  );
                })}
              </div>

            </div>
          </section>

          {/* THANH ĐIỀU HƯỚNG CỐ ĐỊNH DƯỚI ĐÁY MÀN HÌNH ĐIỆN THOẠI */}
          <div className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-[#0A0908]/95 backdrop-blur-lg border-t border-stone-800 px-2 py-1.5 flex items-center justify-around">
            <button onClick={() => scrollTo('tra-cuu')} className="flex flex-col items-center gap-0.5 px-2 py-1 text-[10px] font-medium text-stone-300">
              <span className="text-amber-300 text-sm">🔍</span>
              <span>Tra Mệnh</span>
            </button>
            <button onClick={() => scrollTo('van-han-2027')} className="flex flex-col items-center gap-0.5 px-2 py-1 text-[10px] font-medium text-stone-300">
              <span className="text-amber-300 text-sm">📅</span>
              <span>Vận 2027</span>
            </button>
            <button onClick={() => scrollTo('bo-suu-tap')} className="flex flex-col items-center gap-0.5 px-2 py-1 text-[10px] font-medium text-stone-300">
              <span className="text-amber-300 text-sm">📿</span>
              <span>8 Mặt Phật</span>
            </button>
            <button
              onClick={() => openModal(destinyResult?.buddha || buddhas.THIEN_THU, birthYear)}
              className="px-3.5 py-2 rounded-xl bg-amber-400 text-stone-950 font-bold text-xs flex items-center gap-1"
            >
              <span>{destinyResult?.branch ? `Thỉnh Tuổi ${destinyResult.branch}` : 'Thỉnh Ngay'}</span>
            </button>
          </div>

          {/* FOOTER TỐI GIẢN */}
          <footer className="py-8 bg-[#070605] border-t border-stone-900 text-center text-xs text-stone-500">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <span className="font-bold text-amber-200/90">PHẬT BẢN MỆNH 12 CON GIÁP</span>
              <span>Đồng Thau Nguyên Khối • Viền Đá Ngọc Thạch Anh / Lục Bảo • Ship 19K (Freeship + Tặng quà khi CK QR)</span>
              <span className="text-[11px] text-stone-600">© 2026 Phật Bản Mệnh • Tâm Linh Việt</span>
            </div>
          </footer>

          {/* MODAL ĐĂNG NHẬP ADMIN */}
          {loginModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <form onSubmit={handleAdminLogin} className="w-full max-w-xs rounded-2xl bg-[#14110F] border border-stone-700 p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-sm text-amber-200">🔒 Đăng Nhập Admin</h3>
                  <button type="button" onClick={() => setLoginModalOpen(false)} className="text-stone-400 hover:text-white">✕</button>
                </div>
                <div>
                  <label className="block text-[11px] text-stone-400 mb-1">Tài khoản</label>
                  <input
                    value={loginForm.user}
                    onChange={e => setLoginForm({ ...loginForm, user: e.target.value, error: '' })}
                    placeholder="phatbanmenh"
                    className="w-full px-3 py-2 rounded-xl bg-[#0A0908] border border-stone-700 text-xs text-white"
                  />
                </div>
                <div>
                  <label className="block text-[11px] text-stone-400 mb-1">Mật khẩu</label>
                  <input
                    type="password"
                    value={loginForm.pass}
                    onChange={e => setLoginForm({ ...loginForm, pass: e.target.value, error: '' })}
                    placeholder="•••••••••"
                    className="w-full px-3 py-2 rounded-xl bg-[#0A0908] border border-stone-700 text-xs text-white"
                  />
                </div>
                {loginForm.error && (
                  <p className="text-[11px] text-amber-300 font-medium">{loginForm.error}</p>
                )}
                <button type="submit" className="w-full py-2.5 rounded-xl bg-amber-400 text-stone-950 font-bold text-xs">
                  Đăng Nhập
                </button>
              </form>
            </div>
          )}

          {/* MODAL ĐẶT THỈNH */}
          {modalOpen && selectedBuddha && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
              <div className="relative w-full max-w-md rounded-2xl bg-[#14110F] border border-stone-700 p-5 sm:p-6 shadow-2xl text-stone-100 my-auto">
                <button
                  onClick={() => setModalOpen(false)}
                  className="absolute top-4 right-4 p-1.5 rounded-full bg-stone-900 text-stone-400 hover:text-white"
                >
                  ✕
                </button>

                {orderStep === 'success' && createdOrder ? (
                  <div className="text-center py-6 space-y-3">
                    <div className="text-4xl text-amber-300">✓</div>
                    <h3 className="text-xl font-bold text-amber-200">Đặt Thỉnh Thành Công! ({createdOrder.id})</h3>
                    <p className="text-xs text-stone-300 leading-relaxed">
                      Cảm ơn <strong className="text-white">{createdOrder.name}</strong> ({createdOrder.phone}).<br />
                      Vật phẩm: <strong className="text-amber-200">{createdOrder.buddhaName}</strong>.
                    </p>
                    <div className="p-3 rounded-xl bg-[#0A0908] border border-stone-800 text-xs space-y-1">
                      <div className="text-amber-200 font-semibold">🎁 {createdOrder.freeGift}</div>
                      <div className="text-amber-300 font-bold">Tổng thanh toán: {formatVND(createdOrder.total)}</div>
                    </div>
                    <button
                      onClick={() => setModalOpen(false)}
                      className="px-6 py-2.5 rounded-xl bg-amber-400 text-stone-950 font-bold text-xs"
                    >
                      Hoàn Tất
                    </button>
                  </div>
                ) : orderStep === 'qr' && createdOrder ? (
                  <div className="space-y-4 text-center">
                    <span className="inline-block px-3 py-1 rounded-full bg-[#1C1814] text-amber-200 text-[11px] font-semibold border border-amber-500/30">
                      🎁 Đã kích hoạt: FREESHIP + Tặng 01 Quà Phong Thuỷ Ngẫu Nhiên
                    </span>
                    <h3 className="text-lg font-bold text-amber-200">Quét Mã VietQR Chuyển Khoản</h3>
                    <div className="bg-white p-3 rounded-2xl w-52 h-52 mx-auto">
                      <img
                        src={`https://img.vietqr.io/image/${bankCfg.bankName}-${bankCfg.accountNo}-compact2.png?amount=${createdOrder.total * 1000}&addInfo=${encodeURIComponent(`PBM ${createdOrder.phone}`)}&accountName=${encodeURIComponent(bankCfg.accountName)}`}
                        alt="VietQR"
                        className="w-full h-full object-contain"
                      />
                    </div>
                    <div className="p-3 rounded-xl bg-[#0A0908] border border-stone-800 text-left text-xs space-y-1.5">
                      <div className="flex justify-between">
                        <span className="text-stone-400">Ngân hàng:</span>
                        <strong className="text-white">{bankCfg.bankName}</strong>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-stone-400">Số tài khoản:</span>
                        <strong className="text-amber-300">{bankCfg.accountNo}</strong>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-stone-400">Chủ TK:</span>
                        <strong className="text-white">{bankCfg.accountName}</strong>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-stone-400">Số tiền (Đã Freeship):</span>
                        <strong className="text-amber-300 text-sm">{formatVND(createdOrder.total)}</strong>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-stone-400">Nội dung CK:</span>
                        <strong className="text-amber-200">PBM {createdOrder.phone}</strong>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setOrderStep('form')}
                        className="px-4 py-2.5 rounded-xl bg-stone-800 text-stone-300 text-xs font-bold"
                      >
                        ← Quay lại
                      </button>
                      <button
                        type="button"
                        onClick={() => finalizeOrder(createdOrder)}
                        className="flex-1 py-2.5 rounded-xl bg-amber-400 text-stone-950 font-bold text-xs"
                      >
                        ✓ Tôi Đã Chuyển Khoản Xong
                      </button>
                    </div>
                  </div>
                ) : (
                  <form onSubmit={handleOrderSubmit} className="space-y-3.5">
                    <div className="flex items-center gap-3 pb-3 border-b border-stone-800">
                      <ProductVisual buddha={selectedBuddha} size="sm" />
                      <div className="flex-1 min-w-0">
                        <span className="text-[10px] font-semibold text-stone-400 uppercase">{selectedBuddha.zodiacBadge}</span>
                        <h3 className="text-base font-bold text-amber-200 truncate">{selectedBuddha.fullName}</h3>
                        <p className="text-[11px] text-stone-400 mt-0.5 leading-snug">
                          Đồng Thau Nguyên Khối chuẩn năng lượng phong thuỷ • Viền Đá Ngọc Thạch Anh / Lục Bảo
                        </p>
                        <div className="flex items-center gap-2 mt-1">
                          <span className="text-base font-bold text-amber-300">{formatVND(selectedBuddha.price)}</span>
                          <span className="text-xs text-stone-500 line-through">{formatVND(selectedBuddha.oldPrice)}</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 font-bold">-65%</span>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-[11px] text-stone-400 mb-1">Họ và Tên *</label>
                        <input
                          type="text"
                          required
                          value={orderForm.name}
                          onChange={(e) => setOrderForm({ ...orderForm, name: e.target.value })}
                          placeholder="Nguyễn Văn A"
                          className="w-full px-3 py-2 rounded-xl bg-[#0A0908] border border-stone-700 text-white text-xs focus:outline-none focus:border-amber-400"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] text-stone-400 mb-1">Số ĐT / Zalo *</label>
                        <input
                          type="tel"
                          required
                          value={orderForm.phone}
                          onChange={(e) => setOrderForm({ ...orderForm, phone: e.target.value })}
                          placeholder="0912..."
                          className="w-full px-3 py-2 rounded-xl bg-[#0A0908] border border-stone-700 text-white text-xs focus:outline-none focus:border-amber-400"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2.5">
                      <div className="col-span-2">
                        <label className="block text-[11px] text-stone-400 mb-1">Địa chỉ nhận vật phẩm *</label>
                        <input
                          type="text"
                          required
                          value={orderForm.address}
                          onChange={(e) => setOrderForm({ ...orderForm, address: e.target.value })}
                          placeholder="Số nhà, đường, quận/huyện, tỉnh..."
                          className="w-full px-3 py-2 rounded-xl bg-[#0A0908] border border-stone-700 text-white text-xs focus:outline-none focus:border-amber-400"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] text-stone-400 mb-1">Năm sinh</label>
                        <input
                          type="number"
                          value={orderForm.birthYear}
                          onChange={(e) => setOrderForm({ ...orderForm, birthYear: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl bg-[#0A0908] border border-stone-700 text-amber-200 font-bold text-xs focus:outline-none focus:border-amber-400"
                        />
                      </div>
                    </div>

                    <div className="space-y-2 pt-1">
                      <label className="block text-[11px] text-stone-400 font-semibold uppercase">Phương thức thanh toán & Ưu đãi:</label>
                      
                      <label
                        onClick={() => setOrderForm({ ...orderForm, payMethod: 'bank' })}
                        className={`flex items-start gap-2.5 p-3 rounded-xl border cursor-pointer transition-all ${
                          orderForm.payMethod === 'bank'
                            ? 'bg-[#1C1813] border-amber-400'
                            : 'bg-[#0A0908] border-stone-800'
                        }`}
                      >
                        <input
                          type="radio"
                          name="payMethod"
                          checked={orderForm.payMethod === 'bank'}
                          onChange={() => setOrderForm({ ...orderForm, payMethod: 'bank' })}
                          className="mt-0.5 accent-amber-400"
                        />
                        <div className="text-xs">
                          <div className="font-bold text-amber-200">
                            ⚡ Chuyển khoản QR (Khuyên dùng)
                          </div>
                          <p className="text-[11px] text-stone-300 mt-0.5">
                            ✨ <strong className="text-amber-300">FREESHIP (Miễn phí ship 19.000đ)</strong> + <strong className="text-amber-200">Tặng thêm 01 món quà phong thuỷ ngẫu nhiên</strong>
                          </p>
                        </div>
                      </label>

                      <label
                        onClick={() => setOrderForm({ ...orderForm, payMethod: 'cod' })}
                        className={`flex items-start gap-2.5 p-3 rounded-xl border cursor-pointer transition-all ${
                          orderForm.payMethod === 'cod'
                            ? 'bg-[#1C1813] border-amber-400'
                            : 'bg-[#0A0908] border-stone-800'
                        }`}
                      >
                        <input
                          type="radio"
                          name="payMethod"
                          checked={orderForm.payMethod === 'cod'}
                          onChange={() => setOrderForm({ ...orderForm, payMethod: 'cod' })}
                          className="mt-0.5 accent-amber-400"
                        />
                        <div className="text-xs">
                          <div className="font-bold text-stone-200">
                            🚚 Thanh toán khi nhận hàng (COD)
                          </div>
                          <p className="text-[11px] text-stone-400 mt-0.5">
                            Kiểm tra hàng trước khi thanh toán • Phí vận chuyển: <strong>19.000 ₫</strong>
                          </p>
                        </div>
                      </label>
                    </div>

                    <div className="p-3 rounded-xl bg-[#0A0908] border border-stone-800 text-xs space-y-1.5">
                      <div className="flex justify-between text-stone-400">
                        <span>Giá thỉnh vật phẩm ({orderPricing.qty} mặt):</span>
                        <span className="text-white font-semibold">{formatVND(orderPricing.subtotal)}</span>
                      </div>
                      <div className="flex justify-between text-stone-400">
                        <span>Phí vận chuyển:</span>
                        <span className={orderPricing.isBankQR ? 'text-amber-300 font-bold' : 'text-white'}>
                          {orderPricing.isBankQR ? 'MIỄN PHÍ (0 ₫)' : formatVND(orderPricing.shipFee)}
                        </span>
                      </div>
                      {orderPricing.isBankQR && (
                        <div className="flex justify-between text-stone-300 font-medium">
                          <span>🎁 Quà tặng kèm:</span>
                          <span>+01 Quà phong thuỷ ngẫu nhiên</span>
                        </div>
                      )}
                      <div className="flex justify-between text-sm font-bold pt-1.5 border-t border-stone-800">
                        <span className="text-stone-200">Tổng thanh toán:</span>
                        <span className="text-amber-300">{formatVND(orderPricing.total)}</span>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-stone-950 font-bold text-xs sm:text-sm transition-all"
                    >
                      {orderForm.payMethod === 'bank'
                        ? `Quét QR Đặt Thỉnh (${formatVND(orderPricing.total)} • Freeship + Quà)`
                        : `Xác Nhận Đặt Thỉnh COD (${formatVND(orderPricing.total)})`}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
