    function calculateDestiny(yearInput, buddhasMap) {
      const year = parseInt(yearInput, 10);
      if (isNaN(year) || year < 1920 || year > 2040) return null;
      const stem = STEMS[year % 10];
      const branch = BRANCHES[year % 12];
      const canChi = `${stem} ${branch}`;
      const napAm = NAP_AM_MAP[canChi] || { element: 'Kim', detail: 'Bản mệnh Cát Tường', color: 'text-amber-300' };
      const zodiacInfo = ZODIAC_DATA_2027.find(z => z.branch === branch);
      const buddha = (buddhasMap || INITIAL_BUDDHAS)[zodiacInfo.buddhaId];
      return { year, stem, branch, canChi, napAm, zodiacInfo, buddha };
    }

            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
              URL.revokeObjectURL(url);
              const maxDim = 1000;
              let w = img.width, h = img.height;
              if (w > maxDim || h > maxDim) {
                const r = Math.min(maxDim / w, maxDim / h);
                w = Math.round(w * r);
                h = Math.round(h * r);
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              canvas.toBlob(b => resolve(b), 'image/webp', 0.86);
            };
            img.src = url;
          });

          let imageUrl = '';
          if (cldCfg.cloud && cldCfg.preset) {
            const fd = new FormData();
            fd.append('file', blob);
            fd.append('upload_preset', cldCfg.preset);
            fd.append('folder', 'phatbanmenh');
            const res = await fetch(`https://api.cloudinary.com/v1_1/${cldCfg.cloud}/image/upload`, { method: 'POST', body: fd });

              imageUrl = data.secure_url;

          }
          if (!imageUrl) {
            imageUrl = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = e => resolve(e.target.result);
              reader.readAsDataURL(blob);
            });

          <section id="van-han-2027" className="relative z-10 py-8 sm:py-14 bg-[#110E0C]/90 border-b border-amber-500/15">
            <div className="max-w-6xl mx-auto px-3 sm:px-4">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-5 sm:mb-8">
                <div>
                  <span className="text-[11px] font-bold uppercase tracking-widest text-amber-400 flex items-center gap-1.5">
                    <Icon name="calendar" className="w-3.5 h-3.5" />
                    NĂM ĐINH MÙI 2027 • THIÊN HÀ THỦY
                  </span>
                  <h2 className="font-serif-title text-xl sm:text-3xl font-bold text-white mt-0.5">Tra Nhanh Vận Hạn 12 Con Giáp 2027</h2>
                </div>

                <div className="grid grid-cols-3 sm:flex gap-1.5 sm:gap-2">
                  {[
                    { id: 'ALL', label: 'Tất Cả (12)' },
                    { id: 'HAN_2027', label: '⚠️ Thái Tuế (6)' },
                    { id: 'CAT_2027', label: '✨ Đại Cát (6)' }
                  ].map(tab => (
                    <button
                      key={tab.id} onClick={() => setFilter2027(tab.id)}
                      className={`px-2.5 sm:px-3.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold transition-all border ${
                        filter2027 === tab.id ? 'bg-amber-500 text-stone-950 border-amber-400 shadow' : 'bg-[#1A1512] text-stone-300 border-stone-800 hover:border-amber-500/40'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
                {filtered2027List.map((z) => {
                  const buddha = buddhas[z.buddhaId] || INITIAL_BUDDHAS[z.buddhaId];
                  return (
                    <div key={z.branch} className="p-3.5 sm:p-4 rounded-2xl bg-[#16120F]/95 border border-amber-500/15 hover:border-amber-500/40 transition-all flex flex-col justify-between gap-2.5">
                      <div>
                        <div className="flex items-center justify-between mb-1.5">
                          <div className="flex items-center gap-2">
                            <span className="text-2xl">{z.emoji}</span>
                            <span className="font-bold text-sm sm:text-base text-white">Tuổi {z.branch}</span>
                          </div>
                          <span className={`text-[10px] sm:text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${
                            z.statusType === 'excellent' ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' :
                            z.statusType === 'danger' ? 'bg-red-500/15 text-red-300 border-red-500/30' :
                            z.statusType === 'warning' ? 'bg-amber-500/15 text-amber-300 border-amber-500/30' :
                            'bg-sky-500/15 text-sky-300 border-sky-500/30'
                          }`}>
                            {z.status2027}
                          </span>
                        </div>
                        <p className="text-xs text-stone-300 leading-relaxed">{z.tip2027}</p>
                      </div>

                      <div className="pt-2 border-t border-stone-800/80 flex items-center justify-between">
                        <span className="text-[11px] text-amber-300 font-medium">Phật độ: <strong>{buddha.name}</strong></span>
                        <button onClick={() => openModal(buddha, z.sampleYear)} className="text-xs font-bold text-emerald-400 hover:text-emerald-300 underline">
                          Thỉnh giải hạn →
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {/* 3. BỘ SƯU TẬP 8 VỊ PHẬT BẢN MỆNH */}
          <section id="bo-suu-tap" className="relative z-10 py-8 sm:py-14 border-b border-amber-500/10">
            <div className="max-w-6xl mx-auto px-3 sm:px-4">
              <div className="text-center sm:text-left mb-5 sm:mb-8">
                <span className="text-[11px] font-bold uppercase tracking-widest text-emerald-400">🪷 PHÁP KHÍ HỘ MỆNH ĐỒNG THAU NGUYÊN KHỐI</span>
                <h2 className="font-serif-title text-xl sm:text-3xl font-bold text-white mt-0.5">
                  8 Mặt Dây Chuyền <span className="text-amber-400">Phật Bản Mệnh</span>
                </h2>
              </div>

              <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-5">
                {Object.values(buddhas).map((buddha) => (
                  <div
                    key={buddha.id} onClick={() => openModal(buddha)}
                    className="cursor-pointer rounded-2xl bg-gradient-to-b from-[#171310] to-[#0E0C0A] border border-amber-500/25 hover:border-amber-400 transition-all p-2.5 sm:p-4 flex flex-col justify-between group shadow-lg"
                  >
                    <div>
                      <div className="flex items-center justify-between gap-1 mb-1.5">
                        <span className="px-2 py-0.5 rounded-md bg-emerald-950/90 border border-emerald-500/30 text-emerald-300 text-[10px] sm:text-xs font-bold truncate">
                          {buddha.zodiacBadge}
                        </span>
                        <span className="text-xs sm:text-sm font-bold text-amber-400 shrink-0">{formatVND(buddha.price)}</span>
                      </div>

                      <div className="py-1 scale-90 sm:scale-100 origin-center">
                        <ProductVisual buddha={buddha} size="md" />
                      </div>

                      <div className="text-center mt-1 space-y-1">
                        <h3 className="text-xs sm:text-base font-bold text-amber-300 group-hover:text-white transition-colors line-clamp-1">
                          {buddha.name}
                        </h3>
                        <p className="text-[9px] sm:text-[10px] text-emerald-400/90 font-medium line-clamp-1">
                          Đồng Thau • Đá Lục Bảo
                        </p>
                        <div className="hidden sm:flex flex-wrap justify-center gap-1.5 pt-1">
                          {buddha.tags.slice(0, 2).map((t, idx) => (
                            <span key={idx} className="text-[11px] px-2 py-0.5 rounded bg-stone-900 text-stone-300 border border-stone-800">{t}</span>
                          ))}
                        </div>
                      </div>
                    </div>

                    <button type="button" className="mt-2.5 sm:mt-4 w-full py-2 sm:py-2.5 rounded-xl bg-amber-500/20 group-hover:bg-amber-500 text-amber-300 group-hover:text-stone-950 font-bold text-[11px] sm:text-xs border border-amber-500/35 transition-all">
                      Thỉnh • {formatVND(buddha.price)}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* THANH ĐIỀU HƯỚNG CỐ ĐỊNH DƯỚI ĐÁY MÀN HÌNH ĐIỆN THOẠI */}
          <div className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-[#0D0B09]/95 backdrop-blur-lg border-t border-amber-500/30 px-2 py-1.5 flex items-center justify-around shadow-[0_-8px_25px_rgba(0,0,0,0.8)]">
            <button onClick={() => scrollTo('tra-cuu')} className="flex flex-col items-center gap-0.5 px-2 py-1 text-[10px] font-semibold text-amber-300">
              <Icon name="search" className="w-4 h-4" />
              <span>Tra Mệnh</span>
            </button>
            <button onClick={() => scrollTo('van-han-2027')} className="flex flex-col items-center gap-0.5 px-2 py-1 text-[10px] font-semibold text-stone-300">
              <Icon name="calendar" className="w-4 h-4 text-emerald-400" />
              <span>Vận 2027</span>
            </button>
            <button onClick={() => scrollTo('bo-suu-tap')} className="flex flex-col items-center gap-0.5 px-2 py-1 text-[10px] font-semibold text-stone-300">
              <Icon name="gem" className="w-4 h-4 text-amber-400" />
              <span>8 Mặt Phật</span>
            </button>
            <button
              onClick={() => openModal(destinyResult?.buddha || buddhas.THIEN_THU, birthYear)}
              className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-400 to-amber-600 text-stone-950 font-bold text-xs shadow-md flex items-center gap-1"
            >
              <Icon name="bag" className="w-3.5 h-3.5" />
              <span>Thỉnh 349K</span>
            </button>
          </div>

          <footer className="py-8 bg-[#070708] border-t border-amber-500/15 text-center text-xs text-stone-500">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <span className="font-bold text-amber-300">PHẬT BẢN MỆNH 12 CON GIÁP</span>
              <span>Đồng Thau Nguyên Khối • Viền Đá Ngọc Thạch Anh / Lục Bảo • Ship 19K (Freeship + Tặng quà khi CK QR)</span>
              <button onClick={() => setLoginModalOpen(true)} className="text-stone-400 hover:text-amber-400 underline text-[11px]">
                ⚙️ Quản trị (Admin)
              </button>
            </div>
          </footer>

          {/* Modal Đăng Nhập Admin */}
          {loginModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <form onSubmit={handleAdminLogin} className="w-full max-w-xs rounded-2xl bg-[#181311] border border-amber-500/40 p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-sm text-amber-300 flex items-center gap-1.5">
                    <Icon name="lock" className="w-4 h-4" />
                    <span>Đăng Nhập Admin</span>
                  </h3>
                  <button type="button" onClick={() => setLoginModalOpen(false)} className="text-stone-400 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
                </div>
                <div>
                  <label className="block text-[11px] text-stone-400 mb-1">Tài khoản</label>
                  <input value={loginForm.user} onChange={e => setLoginForm({ ...loginForm, user: e.target.value, error: '' })} placeholder="phatbanmenh" className="w-full px-3 py-2 rounded-xl bg-[#0B0B0C] border border-stone-700 text-xs text-white" />
                </div>
                <div>
                  <label className="block text-[11px] text-stone-400 mb-1">Mật khẩu</label>
                  <input type="password" value={loginForm.pass} onChange={e => setLoginForm({ ...loginForm, pass: e.target.value, error: '' })} placeholder="•••••••••" className="w-full px-3 py-2 rounded-xl bg-[#0B0B0C] border border-stone-700 text-xs text-white" />
                </div>
                {loginForm.error && <p className="text-[11px] text-red-400 font-medium">{loginForm.error}</p>}
                <button type="submit" className="w-full py-2.5 rounded-xl bg-amber-500 text-stone-950 font-bold text-xs">Đăng Nhập</button>
              </form>
            </div>
          )}

          {/* Modal Đặt Thỉnh */}
          {modalOpen && selectedBuddha && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
              <div className="relative w-full max-w-md rounded-2xl bg-[#181311] border border-amber-500/40 p-5 sm:p-6 shadow-2xl text-stone-100 my-auto">
                <button onClick={() => setModalOpen(false)} className="absolute top-4 right-4 p-1.5 rounded-full bg-stone-900 text-stone-400 hover:text-white">
                  <Icon name="x" className="w-4 h-4" />
                </button>

                {orderStep === 'success' && createdOrder ? (
                  <div className="text-center py-6 space-y-3">
                    <Icon name="check" className="w-12 h-12 text-emerald-400 mx-auto" />
                    <h3 className="text-xl font-bold text-amber-300">Đặt Thỉnh Thành Công! ({createdOrder.id})</h3>
                    <p className="text-xs text-stone-300 leading-relaxed">
                      Cảm ơn <strong className="text-white">{createdOrder.name}</strong> ({createdOrder.phone}).<br />
                      Vật phẩm: <strong className="text-amber-300">{createdOrder.buddhaName}</strong>.
                    </p>
                    <div className="p-3 rounded-xl bg-[#0B0B0C] border border-emerald-500/30 text-xs space-y-1">
                      <div className="text-emerald-300 font-bold">🎁 {createdOrder.freeGift}</div>
                      <div className="text-amber-300 font-bold">Tổng thanh toán: {formatVND(createdOrder.total)}</div>
                    </div>
                    <button onClick={() => setModalOpen(false)} className="px-6 py-2.5 rounded-xl bg-amber-500 text-stone-950 font-bold text-xs">Hoàn Tất</button>
                  </div>
                ) : orderStep === 'qr' && createdOrder ? (
                  <div className="space-y-4 text-center">
                    <span className="inline-block px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] font-bold border border-emerald-500/30">
                      🎁 Đã kích hoạt: FREESHIP + Tặng 01 Quà Phong Thuỷ Ngẫu Nhiên
                    </span>
                    <h3 className="text-lg font-bold text-amber-300">Quét Mã VietQR Chuyển Khoản</h3>
                    <div className="bg-white p-3 rounded-2xl w-52 h-52 mx-auto">
                      <img
                        src={`https://img.vietqr.io/image/${bankCfg.bankName}-${bankCfg.accountNo}-compact2.png?amount=${createdOrder.total * 1000}&addInfo=${encodeURIComponent(`PBM ${createdOrder.phone}`)}&accountName=${encodeURIComponent(bankCfg.accountName)}`}
                        alt="VietQR" className="w-full h-full object-contain"
                      />
                    </div>
                    <div className="p-3 rounded-xl bg-[#0B0B0C] border border-stone-800 text-left text-xs space-y-1.5">
                      <div className="flex justify-between"><span className="text-stone-400">Ngân hàng:</span><strong className="text-white">{bankCfg.bankName}</strong></div>
                      <div className="flex justify-between"><span className="text-stone-400">Số tài khoản:</span><strong className="text-amber-300">{bankCfg.accountNo}</strong></div>
                      <div className="flex justify-between"><span className="text-stone-400">Chủ TK:</span><strong className="text-white">{bankCfg.accountName}</strong></div>
                      <div className="flex justify-between"><span className="text-stone-400">Số tiền (Đã Freeship):</span><strong className="text-emerald-400 text-sm">{formatVND(createdOrder.total)}</strong></div>
                      <div className="flex justify-between"><span className="text-stone-400">Nội dung CK:</span><strong className="text-amber-300">PBM {createdOrder.phone}</strong></div>
                    </div>
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setOrderStep('form')} className="px-4 py-2.5 rounded-xl bg-stone-800 text-stone-300 text-xs font-bold">← Quay lại</button>
                      <button type="button" onClick={() => finalizeOrder(createdOrder)} className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 text-stone-950 font-bold text-xs">
                        ✓ Tôi Đã Chuyển Khoản Xong
                      </button>
                    </div>
                  </div>
                ) : (
                  <form onSubmit={handleOrderSubmit} className="space-y-3.5">
                    <div className="flex items-center gap-3 pb-3 border-b border-stone-800">
                      <ProductVisual buddha={selectedBuddha} size="sm" />
                      <div className="flex-1 min-w-0">
                        <span className="text-[10px] font-bold text-emerald-400 uppercase">{selectedBuddha.zodiacBadge}</span>
                        <h3 className="text-base font-bold text-amber-300 truncate">{selectedBuddha.fullName}</h3>
                        <p className="text-[11px] text-stone-300 mt-0.5 leading-snug">Đồng Thau Nguyên Khối chuẩn năng lượng phong thuỷ • Viền Đá Ngọc Thạch Anh / Lục Bảo</p>
                        <div className="flex items-center gap-2 mt-1">
                          <span className="text-base font-bold text-amber-400">{formatVND(selectedBuddha.price)}</span>
                          <span className="text-xs text-stone-500 line-through">{formatVND(selectedBuddha.oldPrice)}</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-red-500/20 text-red-300 font-bold">-65%</span>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-[11px] text-stone-400 mb-1">Họ và Tên *</label>
                        <input type="text" required value={orderForm.name} onChange={(e) => setOrderForm({ ...orderForm, name: e.target.value })} placeholder="Nguyễn Văn A" className="w-full px-3 py-2 rounded-xl bg-[#0B0B0C] border border-stone-700 text-white text-xs focus:outline-none focus:border-amber-400" />
                      </div>
                      <div>
                        <label className="block text-[11px] text-stone-400 mb-1">Số ĐT / Zalo *</label>
                        <input type="tel" required value={orderForm.phone} onChange={(e) => setOrderForm({ ...orderForm, phone: e.target.value })} placeholder="0912..." className="w-full px-3 py-2 rounded-xl bg-[#0B0B0C] border border-stone-700 text-white text-xs focus:outline-none focus:border-amber-400" />
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2.5">
                      <div className="col-span-2">
                        <label className="block text-[11px] text-stone-400 mb-1">Địa chỉ nhận vật phẩm *</label>
                        <input type="text" required value={orderForm.address} onChange={(e) => setOrderForm({ ...orderForm, address: e.target.value })} placeholder="Số nhà, đường, quận/huyện, tỉnh..." className="w-full px-3 py-2 rounded-xl bg-[#0B0B0C] border border-stone-700 text-white text-xs focus:outline-none focus:border-amber-400" />
                      </div>
                      <div>
                        <label className="block text-[11px] text-stone-400 mb-1">Năm sinh</label>
                        <input type="number" value={orderForm.birthYear} onChange={(e) => setOrderForm({ ...orderForm, birthYear: e.target.value })} className="w-full px-3 py-2 rounded-xl bg-[#0B0B0C] border border-stone-700 text-amber-300 font-bold text-xs focus:outline-none focus:border-amber-400" />
                      </div>
                    </div>

                    <div className="space-y-2 pt-1">
                      <label className="block text-[11px] text-stone-400 font-semibold uppercase">Phương thức thanh toán & Ưu đãi:</label>
                      <label onClick={() => setOrderForm({ ...orderForm, payMethod: 'bank' })} className={`flex items-start gap-2.5 p-3 rounded-xl border cursor-pointer transition-all ${orderForm.payMethod === 'bank' ? 'bg-emerald-950/50 border-emerald-400' : 'bg-[#0B0B0C] border-stone-800'}`}>
                        <input type="radio" name="payMethod" checked={orderForm.payMethod === 'bank'} onChange={() => setOrderForm({ ...orderForm, payMethod: 'bank' })} className="mt-0.5 accent-emerald-400" />
                        <div className="text-xs">
                          <div className="font-bold text-emerald-300 flex items-center gap-1.5">
                            <Icon name="qr" className="w-3.5 h-3.5" />
                            <span>Chuyển khoản QR (Khuyên dùng)</span>
                          </div>
                          <p className="text-[11px] text-stone-300 mt-0.5">
                            ✨ <strong className="text-amber-300">FREESHIP (Miễn phí ship 19.000đ)</strong> + <strong className="text-emerald-300">Tặng thêm 01 món quà phong thuỷ ngẫu nhiên</strong>
                          </p>
                        </div>
                      </label>

                      <label onClick={() => setOrderForm({ ...orderForm, payMethod: 'cod' })} className={`flex items-start gap-2.5 p-3 rounded-xl border cursor-pointer transition-all ${orderForm.payMethod === 'cod' ? 'bg-amber-950/30 border-amber-400' : 'bg-[#0B0B0C] border-stone-800'}`}>
                        <input type="radio" name="payMethod" checked={orderForm.payMethod === 'cod'} onChange={() => setOrderForm({ ...orderForm, payMethod: 'cod' })} className="mt-0.5 accent-amber-400" />
                        <div className="text-xs">
                          <div className="font-bold text-stone-200 flex items-center gap-1.5">
                            <Icon name="truck" className="w-3.5 h-3.5 text-amber-400" />
                            <span>Thanh toán khi nhận hàng (COD)</span>
                          </div>
                          <p className="text-[11px] text-stone-400 mt-0.5">Kiểm tra hàng trước khi thanh toán • Phí vận chuyển: <strong>19.000 ₫</strong></p>
                        </div>
                      </label>
                    </div>

                    <div className="p-3 rounded-xl bg-[#0B0B0C] border border-stone-800 text-xs space-y-1.5">
                      <div className="flex justify-between text-stone-400">
                        <span>Giá thỉnh vật phẩm ({orderPricing.qty} mặt):</span>
                        <span className="text-white font-semibold">{formatVND(orderPricing.subtotal)}</span>
                      </div>
                      <div className="flex justify-between text-stone-400">
                        <span>Phí vận chuyển:</span>
                        <span className={orderPricing.isBankQR ? 'text-emerald-400 font-bold' : 'text-white'}>{orderPricing.isBankQR ? 'MIỄN PHÍ (0 ₫)' : formatVND(orderPricing.shipFee)}</span>
                      </div>
                      {orderPricing.isBankQR && (
                        <div className="flex justify-between text-emerald-300 font-medium">
                          <span>🎁 Quà tặng kèm:</span>
                          <span>+01 Quà phong thuỷ ngẫu nhiên</span>
                        </div>
                      )}
                      <div className="flex justify-between text-sm font-bold pt-1.5 border-t border-stone-800">
                        <span className="text-stone-200">Tổng thanh toán:</span>
                        <span className="text-amber-400">{formatVND(orderPricing.total)}</span>
                      </div>
                    </div>

                    <button type="submit" className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-stone-950 font-bold text-xs sm:text-sm shadow-lg shadow-amber-500/20 hover:brightness-110 transition-all">
                      {orderForm.payMethod === 'bank' ? `Quét QR Đặt Thỉnh (${formatVND(orderPricing.total)} • Freeship + Quà)` : `Xác Nhận Đặt Thỉnh COD (${formatVND(orderPricing.total)})`}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
